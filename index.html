<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESQ-Repair | ระบบส่งซ่อมครุภัณฑ์</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container login-container">
        <div class="login-box">
            <div class="login-header">
                <img src="https://cdn-icons-png.flaticon.com/512/3067/3067256.png" alt="ESQ-Repair Logo" class="logo">
                <h1>ESQ-Repair</h1>
                <p>ระบบส่งซ่อมครุภัณฑ์</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="userType">ประเภทผู้ใช้</label>
                    <select id="userType" class="form-control" required>
                        <option value="">เลือกประเภทผู้ใช้</option>
                        <option value="employee">พนักงาน</option>
                        <option value="officer">เจ้าหน้าที่</option>
                        <option value="admin">ซุปเปอร์แอดมิน</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="username">ชื่อผู้ใช้งาน</label>
                    <input type="text" id="username" class="form-control" placeholder="กรอกชื่อผู้ใช้งาน" required>
                </div>
                
                <div class="form-group">
                    <label for="password">รหัสผ่าน</label>
                    <input type="password" id="password" class="form-control" placeholder="กรอกรหัสผ่าน" required>
                    <div class="password-toggle">
                        <i class="fas fa-eye" id="togglePassword"></i>
                    </div>
                </div>
                
                <div class="test-accounts">
                    <h3>บัญชีทดสอบ:</h3>
                    <div class="account-list">
                        <p><strong>ซุปเปอร์แอดมิน:</strong> user/G1, pass: 123456</p>
                        <p><strong>เจ้าหน้าที่:</strong> user/G2, pass: 123456</p>
                        <p><strong>พนักงาน:</strong> user/G3, pass: 123456</p>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-login">
                    <i class="fas fa-sign-in-alt"></i> เข้าสู่ระบบ
                </button>
                
                <div id="loginError" class="error-message"></div>
            </form>
            
            <div class="theme-toggle">
                <button id="themeToggle" class="btn btn-secondary">
                    <i class="fas fa-moon"></i> โหมดกลางคืน
                </button>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
